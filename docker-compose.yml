version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: ecom-postgres
    restart: always
    ports:
      # HOST_PORT:CONTAINER_PORT
      # Senin bilgisayarında 5433, container içinde 5432 olacak
      - '5434:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: ecom_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: